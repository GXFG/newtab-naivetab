name: PR Check

# 代码校验流水线。
# pre-commit 是本地钩子，可被 `--no-verify` 绕过；这里是不可绕过的兜底。
# 校验项与 pre-commit 对齐，额外加上构建与覆盖率门槛。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 带覆盖率跑，阈值在 vite.config.ts 的 test.coverage.thresholds 中定义
      - name: Test with coverage
        run: pnpm exec vitest test --run --coverage

      - name: Validate registries
        run: pnpm exec tsx scripts/check/validate-registries.ts

      # 图标集必须能由常量表现场复现：CI 重跑生成并要求产物无 diff。
      # 只有测试比对「名字集合」拦不住产物内容被改坏，也拦不住忘了重跑生成脚本。
      - name: Verify icon set
        run: pnpm check:icons

      - name: Check CSS patterns
        run: pnpm check-patterns

      - name: Check architecture boundaries
        run: pnpm check-boundaries

      # 抓构建期问题：manifest 生成、i18n 编译、产物缺失
      - name: Build (chrome)
        run: pnpm build:chrome
